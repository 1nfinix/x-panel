<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#1B1C1F" media="(prefers-color-scheme: dark)">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="icon" type="image/x-icon" href="/favicon.ico">
	<meta content="yes" name="apple-mobile-web-app-capable"/>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="stylesheet"  href="/custom/index.css">
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
	<title>X-Panel</title>
</head>

<body>
	<div id="app">
		<style>
			body { margin: 0; background: #F1F3F6; }
			@media (prefers-color-scheme: dark) { body { background: #1B1C1F; } }
			.loading-wrap { display: flex; justify-content: center; align-items: center; height: 100vh; }
			.loading-wrap img { width: 64px; height: 64px; }
		</style>
		<div class="loading-wrap"><img src="/favicon.svg" alt=""></div>
	</div>
	<script type="module" src="/src/main.ts"></script>
	<script src="/custom/index.js"></script>
</body>

</html>
